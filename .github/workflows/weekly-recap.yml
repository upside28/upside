name: Weekly Staffing Recap

on:
  schedule:
    # Lundi 9h00 heure de Paris (UTC+2 en été / UTC+1 en hiver)
    # En heure d'été (mars–octobre) : 9h Paris = 7h UTC
    # En heure d'hiver (novembre–mars) : 9h Paris = 8h UTC
    # On cible 7h UTC — couvre l'heure d'été ; en hiver l'envoi arrive à 8h Paris.
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  send-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Send weekly recap email
        uses: actions/github-script@v7
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        with:
          script: |
            // ─────────────────────────────────────────────────────────────────
            // 0. Dépendances (node-fetch est disponible dans Node 18 via fetch natif)
            // ─────────────────────────────────────────────────────────────────
            const SUPABASE_URL        = process.env.SUPABASE_URL;
            const SUPABASE_KEY        = process.env.SUPABASE_KEY;
            const AZURE_TENANT_ID     = process.env.AZURE_TENANT_ID;
            const AZURE_CLIENT_ID     = process.env.AZURE_CLIENT_ID;
            const AZURE_CLIENT_SECRET = process.env.AZURE_CLIENT_SECRET;
            const FROM_ADDRESS        = 'envoi-auto@upside.paris';
            const TO_ADDRESS          = 'mroux@upside.paris';

            // ─────────────────────────────────────────────────────────────────
            // 1. Helpers date/semaine
            // ─────────────────────────────────────────────────────────────────

            /** Retourne le lundi de la semaine ISO contenant `date`. */
            function isoMonday(date) {
              const d = new Date(date);
              const day = d.getUTCDay() || 7; // dimanche = 7
              d.setUTCDate(d.getUTCDate() - day + 1);
              d.setUTCHours(0, 0, 0, 0);
              return d;
            }

            /** Numéro de semaine ISO. */
            function isoWeekNumber(date) {
              const d = new Date(date);
              d.setUTCHours(0, 0, 0, 0);
              d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
              const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
              return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            }

            /**
             * Clé de la semaine précédente au format "YYYY-WNN"
             * (le workflow tourne le lundi → on récapitule la semaine qui vient de s'achever).
             */
            function lastWeekKey() {
              const now = new Date();
              const lastMon = isoMonday(new Date(now.getTime() - 7 * 86400000));
              const y = lastMon.getUTCFullYear();
              const w = String(isoWeekNumber(lastMon)).padStart(2, '0');
              return `${y}-W${w}`;
            }

            function lastWeekLabel() {
              const wk = lastWeekKey();
              const [y, wRaw] = wk.split('-W');
              return `S${wRaw} ${y}`;
            }

            // ─────────────────────────────────────────────────────────────────
            // 2. Jours fériés 2026-2028 (France métropolitaine)
            //    Format : "YYYY-MM-DD"
            // ─────────────────────────────────────────────────────────────────
            const JOURS_FERIES = new Set([
              // 2026
              '2026-01-01','2026-04-06','2026-05-01','2026-05-08',
              '2026-05-14','2026-05-25','2026-07-14','2026-08-15',
              '2026-11-01','2026-11-11','2026-12-25',
              // 2027
              '2027-01-01','2027-03-29','2027-05-01','2027-05-08',
              '2027-05-06','2027-05-17','2027-07-14','2027-08-15',
              '2027-11-01','2027-11-11','2027-12-25',
              // 2028
              '2028-01-01','2028-04-17','2028-05-01','2028-05-08',
              '2028-05-25','2028-06-05','2028-07-14','2028-08-15',
              '2028-11-01','2028-11-11','2028-12-25',
            ]);

            /**
             * Fraction de la semaine tombant un jour férié (0.0 – 1.0).
             * Lundi = jour 1 de la semaine ISO.
             */
            function holidayPct(weekKey) {
              const [y, wRaw] = weekKey.split('-W');
              const wNum = parseInt(wRaw, 10);
              // Reconstituer le lundi de cette semaine ISO
              const jan4 = new Date(Date.UTC(parseInt(y, 10), 0, 4));
              const jan4Day = jan4.getUTCDay() || 7;
              const monday = new Date(jan4.getTime() + (wNum * 7 - jan4Day - 2) * 86400000);
              let count = 0;
              for (let i = 0; i < 5; i++) {
                const d = new Date(monday.getTime() + i * 86400000);
                const key = d.toISOString().slice(0, 10);
                if (JOURS_FERIES.has(key)) count++;
              }
              return count / 5;
            }

            // ─────────────────────────────────────────────────────────────────
            // 3. Chargement des données Supabase
            // ─────────────────────────────────────────────────────────────────
            async function supabaseFetch(table, params = '') {
              const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
              const res = await fetch(url, {
                headers: {
                  'apikey':        SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Accept':        'application/json',
                },
              });
              if (!res.ok) throw new Error(`Supabase ${table}: ${res.status} ${await res.text()}`);
              return res.json();
            }

            const [users, missions, entries, priorities] = await Promise.all([
              supabaseFetch('users',      'select=*&archived=eq.false&order=last_name.asc'),
              supabaseFetch('missions',   'select=*&archived=eq.false'),
              supabaseFetch('staffing',   `select=*&week_key=eq.${lastWeekKey()}`),
              supabaseFetch('priorities', 'select=*&order=due_date.asc'),
            ]);

            const wk = lastWeekKey();
            const hp = holidayPct(wk);
            const collaborateurs = users.filter(u => u.role === 'collaborateur' && !u.archived);

            // ─────────────────────────────────────────────────────────────────
            // 4. Construction des sections texte (identique à buildEmailBody)
            // ─────────────────────────────────────────────────────────────────

            // Section 1 — Missions billables
            const missionTotals  = {};
            const missionDetails = {};
            for (const e of entries) {
              if (e.is_absence || !e.mission_id) continue;
              const m = missions.find(m => m.id === e.mission_id);
              if (!m || m.category !== 'billable') continue;
              missionTotals[e.mission_id]  = (missionTotals[e.mission_id] || 0) + e.pct;
              if (!missionDetails[e.mission_id]) missionDetails[e.mission_id] = [];
              const u = users.find(u => u.id === e.user_id);
              if (u) missionDetails[e.mission_id].push({ user: u, pct: e.pct });
            }
            const missionsSorted = Object.entries(missionTotals).sort((a, b) => b[1] - a[1]);

            let sec1 = '';
            if (!missionsSorted.length) {
              sec1 = 'Aucune saisie facturable pour la semaine.\n';
            } else {
              for (const [mid, total] of missionsSorted) {
                const m = missions.find(m => m.id === mid);
                if (!m) continue;
                const label = m.task ? `${m.client} — ${m.task}` : m.client;
                sec1 += `• ${label} : ${Math.round(total * 100)}%\n`;
                const details = (missionDetails[mid] || [])
                  .sort((a, b) => b.pct - a.pct)
                  .map(d => `  ${d.user.first_name} ${d.user.last_name} (${Math.round(d.pct * 100)}%)`)
                  .join(', ');
                sec1 += `  ${details.trim()}\n\n`;
              }
            }

            // Section 2 — Détail par collaborateur
            let sec2 = '';
            for (const u of collaborateurs) {
              const ue  = entries.filter(e => e.user_id === u.id);
              const bil = ue.filter(e => { const m = missions.find(m => m.id === e.mission_id); return m && m.category === 'billable'; });
              const int = ue.filter(e => { const m = missions.find(m => m.id === e.mission_id); return m && m.category === 'internal'; });
              const abs = ue.filter(e => e.is_absence);
              const totalBil = bil.reduce((s, e) => s + e.pct, 0);
              const totalInt = int.reduce((s, e) => s + e.pct, 0);
              const totalAbs = abs.reduce((s, e) => s + e.pct, 0);
              const total    = totalBil + totalInt + Math.max(totalAbs, hp);

              sec2 += `${u.first_name} ${u.last_name} : ${Math.round(total * 100)}%\n`;
              if (!ue.length && hp === 0) {
                sec2 += `  Pas de staffing renseigné cette semaine\n`;
              } else {
                for (const e of bil.sort((a, b) => b.pct - a.pct)) {
                  const m = missions.find(m => m.id === e.mission_id);
                  if (!m) continue;
                  const label = m.task ? `${m.client} — ${m.task}` : m.client;
                  sec2 += `  ${label} : ${Math.round(e.pct * 100)}%\n`;
                }
                for (const e of int.sort((a, b) => b.pct - a.pct)) {
                  const m = missions.find(m => m.id === e.mission_id);
                  if (!m) continue;
                  const label = m.task ? `${m.client} — ${m.task}` : m.client;
                  sec2 += `  ${label} : ${Math.round(e.pct * 100)}%\n`;
                }
                for (const e of abs) {
                  sec2 += `  Congés / Absences : ${Math.round(e.pct * 100)}%\n`;
                }
                if (hp > 0) {
                  sec2 += `  Jours fériés : ${Math.round(hp * 100)}%\n`;
                }
              }
              sec2 += '\n';
            }

            // Section 3 — Priorités (14 jours à venir)
            const today = new Date(); today.setUTCHours(0, 0, 0, 0);
            const limit = new Date(today.getTime() + 14 * 86400000);
            const JOURS_LONG = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
            const MOIS_LONG  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

            const upcomingPrios = priorities
              .filter(p => { const d = new Date(p.due_date); d.setUTCHours(0,0,0,0); return d >= today && d <= limit; })
              .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

            let sec3 = '';
            if (!upcomingPrios.length) {
              sec3 = 'Aucune priorité renseignée pour les deux prochaines semaines.\n';
            } else {
              for (const p of upcomingPrios) {
                const d       = new Date(p.due_date);
                const dateFr  = `${JOURS_LONG[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS_LONG[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
                const m       = missions.find(m => m.id === p.mission_id);
                const mLabel  = m ? (m.task ? `${m.client} — ${m.task}` : m.client) : '';
                const nameLabel = mLabel ? `${p.name} (${mLabel})` : p.name;
                sec3 += `${dateFr} : ${nameLabel}\n`;
                const assignees = (p.assignees || [])
                  .map(uid => users.find(u => u.id === uid))
                  .filter(Boolean)
                  .map(u => `${u.first_name} ${u.last_name}`)
                  .join(', ');
                if (assignees) sec3 += `  Collaborateurs concernés : ${assignees}\n`;
                sec3 += '\n';
              }
            }

            // ─────────────────────────────────────────────────────────────────
            // 5. Assemblage HTML du corps de l'email
            //    Logo : URL publique hébergée sur GitHub Pages ou CDN.
            //    Remplacer LOGO_URL par l'URL définitive si besoin.
            // ─────────────────────────────────────────────────────────────────
            const LOGO_URL  = 'https://upside28.github.io/upside/logo-upside.png';
            const wkLbl     = lastWeekLabel();

            const htmlBody = `<!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"></head>
            <body style="font-family:'Aptos','Segoe UI',Calibri,sans-serif;background:#ffffff;color:#1a1a2e;margin:0;padding:0;">
              <div style="max-width:680px;margin:0 auto;padding:32px 24px;">
                <div style="margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #1a1a2e;">
                  <img src="${LOGO_URL}" alt="Upside" style="height:40px;width:auto;">
                </div>
                <h1 style="font-size:18px;font-weight:700;color:#1a1a2e;margin:0 0 4px 0;">Récapitulatif hebdomadaire de staffing</h1>
                <p style="font-size:13px;color:#666;margin:0 0 28px 0;">Semaine : ${wkLbl}</p>

                <h2 style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b8860b;margin:0 0 10px 0;padding-bottom:6px;border-bottom:1px solid #e5e5e5;">1. Missions</h2>
                <pre style="font-family:'Aptos','Segoe UI',Calibri,sans-serif;font-size:13px;line-height:1.7;margin:0 0 24px 0;white-space:pre-wrap;">${sec1}</pre>

                <h2 style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b8860b;margin:0 0 10px 0;padding-bottom:6px;border-bottom:1px solid #e5e5e5;">2. Détail par collaborateur</h2>
                <pre style="font-family:'Aptos','Segoe UI',Calibri,sans-serif;font-size:13px;line-height:1.7;margin:0 0 24px 0;white-space:pre-wrap;">${sec2}</pre>

                <h2 style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b8860b;margin:0 0 10px 0;padding-bottom:6px;border-bottom:1px solid #e5e5e5;">3. Priorités (2 semaines à venir)</h2>
                <pre style="font-family:'Aptos','Segoe UI',Calibri,sans-serif;font-size:13px;line-height:1.7;margin:0 0 24px 0;white-space:pre-wrap;">${sec3}</pre>

                <div style="margin-top:32px;padding-top:16px;border-top:1px solid #e5e5e5;font-size:11px;color:#999;">
                  Email généré automatiquement par l'outil de staffing Upside.
                </div>
              </div>
            </body>
            </html>`;

            // ─────────────────────────────────────────────────────────────────
            // 6. Authentification OAuth2 client_credentials → Microsoft Graph
            // ─────────────────────────────────────────────────────────────────
            const tokenRes = await fetch(
              `https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token`,
              {
                method:  'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body:    new URLSearchParams({
                  grant_type:    'client_credentials',
                  client_id:     AZURE_CLIENT_ID,
                  client_secret: AZURE_CLIENT_SECRET,
                  scope:         'https://graph.microsoft.com/.default',
                }),
              }
            );
            if (!tokenRes.ok) {
              const err = await tokenRes.text();
              throw new Error(`Échec auth Microsoft Graph : ${tokenRes.status} — ${err}`);
            }
            const { access_token } = await tokenRes.json();

            // ─────────────────────────────────────────────────────────────────
            // 7. Envoi via Microsoft Graph sendMail
            //    contentType: "html" — point central de cette mise à jour
            // ─────────────────────────────────────────────────────────────────
            const mailPayload = {
              message: {
                subject: `Staffing Upside — ${wkLbl}`,
                body: {
                  contentType: 'html',
                  content:     htmlBody,
                },
                toRecipients: [
                  { emailAddress: { address: TO_ADDRESS } },
                ],
              },
              saveToSentItems: false,
            };

            const sendRes = await fetch(
              `https://graph.microsoft.com/v1.0/users/${FROM_ADDRESS}/sendMail`,
              {
                method:  'POST',
                headers: {
                  'Authorization': `Bearer ${access_token}`,
                  'Content-Type':  'application/json',
                },
                body: JSON.stringify(mailPayload),
              }
            );

            if (sendRes.status === 202) {
              console.log(`✅ Email envoyé avec succès — ${wkLbl} → ${TO_ADDRESS}`);
            } else {
              const err = await sendRes.text();
              throw new Error(`Échec envoi Graph : ${sendRes.status} — ${err}`);
            }
