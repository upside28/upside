<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Upside</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;600&family=DM+Serif+Display&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:'Hanken Grotesk',Inter,-apple-system,Helvetica,Arial,sans-serif;color:#07162D;background:#F5F5F7;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;min-width:980px}
#side{width:230px;flex:none;background:rgba(255,255,255,.75);border-right:1px solid rgba(7,22,45,.1);padding:22px 14px;display:flex;flex-direction:column;gap:3px;overflow:auto}
#side img.lg{width:112px;margin:0 8px 18px}
.sh{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#B57F35;margin:18px 10px 6px}
.netcard{width:480px;max-width:100%;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d2226;overflow:hidden}.netcard .nh{display:flex;gap:10px;padding:12px 14px 6px;align-items:center}.netcard .nl{width:48px;height:48px;border-radius:4px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;background:#fff}.netcard .nl img{width:30px}.netcard .nn{font-weight:600;font-size:14px;line-height:1.25}.netcard .ns{font-size:12px;color:#666}.nettxt{padding:4px 14px 10px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.nettxt u{color:#666;text-decoration:none}.netimg{position:relative;background:#eee}.netbadge{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:12px}.netarr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none}.netarr.l{left:8px}.netarr.r{right:8px}.netact{display:flex;justify-content:space-around;padding:10px 6px;border-top:1px solid #e6e6e6;font-size:13px;font-weight:600;color:#555}.netcard.fb .nettxt{font-size:15px}.netrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px;gap:8px}.netrow .lb{flex:1;cursor:pointer}.nettips{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55;color:#4a5568}.nettips li{margin-bottom:8px}

.ni{padding:9px 12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}.ni:hover{background:rgba(7,22,45,.05)}.ni.on{background:#E2DACF;font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:52px;flex:none;border-bottom:1px solid rgba(7,22,45,.1);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:17px;font-weight:700}
#top .st{font-size:12px;font-weight:500;opacity:.55}
#body{flex:1;display:flex;min-height:0}
#center{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;align-items:center;min-width:0}
#insp{width:318px;flex:none;border-left:1px solid rgba(7,22,45,.1);padding:14px;overflow:auto}
.sec{background:#fff;border-radius:14px;padding:13px 14px 14px;margin-bottom:12px}
.sec h4{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:1px;color:#8A8F98;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.seg{display:flex;background:#E8E8EC;border-radius:9px;padding:2px;gap:2px;flex:1}
.seg div{flex:1;text-align:center;padding:6px 4px;font-size:13px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg div.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.dots{display:flex;gap:7px;flex-wrap:wrap}.dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(7,22,45,.2);cursor:pointer}.dot.on{outline:2.5px solid #0A84FF;outline-offset:2px}
.tg{width:42px;height:25px;border-radius:99px;background:#D1D1D6;position:relative;cursor:pointer;flex:none;transition:.15s}.tg.on{background:#34C759}.tg i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}.tg.on i{left:19px}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:12px;font-size:15px;font-weight:600;background:#07162D;color:#fff;cursor:pointer;border:0;font-family:inherit;margin-top:8px}.btn.g{background:#E8E8EC;color:#07162D}
.btn:disabled{opacity:.4}
input[type=text],textarea,select,input[type=number]{width:100%;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #D1D1D6;border-radius:9px;background:#fff;color:#07162D}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=range]{flex:1}
.sub{font-size:12px;opacity:.6;line-height:1.4}
.strip{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.th{width:86px;height:107px;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px rgba(7,22,45,.15);position:relative;background:#fff}.th.on{outline:3px solid #0A84FF;outline-offset:2px}.th canvas{width:100%;height:100%;display:block}
.add{width:86px;height:107px;border-radius:8px;border:2px dashed #B8BCC4;display:flex;align-items:center;justify-content:center;font-size:30px;color:#8A8F98;cursor:pointer}
.pv{box-shadow:0 6px 24px rgba(7,22,45,.2);border-radius:6px;overflow:hidden;position:relative;background:#fff}.pv canvas{display:block;width:100%;height:auto}
.guide{position:absolute;inset:0;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%;max-width:820px;align-self:flex-start}
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid transparent}.card.on{border-color:#0A84FF}.card .ph{height:130px;position:relative;background:#E8E8EC}.card .ph img{width:100%;height:100%;object-fit:cover;display:block}.card .ph b{position:absolute;right:0;top:0;bottom:0;width:14px}
.card .tx{padding:8px 10px;font-size:13px;font-weight:700}.fr{display:flex;height:4px;margin-top:6px}.fr i{display:block}
.newc{border:2px dashed #B8BCC4;background:transparent;display:flex;align-items:center;justify-content:center;font-size:34px;color:#8A8F98;min-height:170px}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos .p{width:62px;height:77px;border-radius:7px;overflow:hidden;position:relative;cursor:pointer}.photos img{width:100%;height:100%;object-fit:cover}.photos .p.on{outline:3px solid #0A84FF}.photos .x{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;text-align:center;line-height:18px}.photos .cv{position:absolute;left:2px;bottom:2px;background:#0A84FF;color:#fff;font-size:10px;padding:0 5px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(3,170px);gap:3px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 6px 24px rgba(7,22,45,.15)}
.gc{position:relative;width:170px;height:212px;overflow:hidden;background:#E8E8EC}.gc img{width:100%;height:100%;object-fit:cover;display:block}.gc .n{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#07162D;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}.gc .t{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);font-size:11px;font-weight:600;padding:3px 7px;display:flex;justify-content:space-between}.gc .t u{cursor:pointer;text-decoration:none;opacity:.6}
.pillb{display:inline-block;padding:3px 10px;border-radius:99px;background:#07162D;color:#fff;font-size:12px;margin:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#07162D;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
@font-face{font-family:'Aeonik';font-weight:400;src:local('Aeonik Regular'),url(fonts/Aeonik-Regular.woff2) format('woff2')}
@font-face{font-family:'Aeonik';font-weight:700;src:local('Aeonik Bold'),url(fonts/Aeonik-Bold.woff2) format('woff2')}
@font-face{font-family:'Aptos';font-weight:300;src:local('Aptos Light'),url(fonts/Aptos-Light.woff2) format('woff2')}
@font-face{font-family:'Aptos';font-weight:600;src:local('Aptos SemiBold'),url(fonts/Aptos-SemiBold.woff2) format('woff2')}
.ch{margin:18px 0 8px;font-size:16px;font-weight:700}
.modes{display:flex;gap:14px;flex-wrap:wrap}.mode{background:#fff;border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer}.mode.on{border-color:#0A84FF}.mode b{display:block;margin-top:8px;font-size:14px}
.mini{display:flex;gap:6px}.mini canvas{width:58px;height:72px;border-radius:4px;box-shadow:0 0 0 1px rgba(7,22,45,.12)}
.back{font-size:14px;color:#0A84FF;cursor:pointer;font-weight:500}
.drop{display:block;border:2px dashed #B8BCC4;border-radius:14px;padding:22px;text-align:center;color:#6b7280;font-size:14px;cursor:pointer;margin-bottom:14px;background:rgba(255,255,255,.6)}.drop:hover{border-color:#0A84FF}
.bigph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.bp{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#E8E8EC}.bp img{width:100%;height:100%;object-fit:cover;display:block}.bp.on{outline:3px solid #0A84FF}
.bp .star{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;width:28px;height:28px;text-align:center;line-height:28px;font-size:16px;cursor:pointer}.bp .x{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:23px;cursor:pointer;font-size:16px}
.card .empty{height:100%;display:flex;align-items:center;justify-content:center;color:#9aa0aa;font-size:12px}
.vrow{margin-bottom:18px}.vt{font-size:14px;font-weight:700}.vgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}canvas.vg{width:84px;height:84px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px rgba(7,22,45,.12)}canvas.vg:hover{box-shadow:0 0 0 3px #0A84FF}
.bds{display:flex;gap:18px;flex-wrap:wrap}.bds canvas{width:216px;height:270px;border-radius:6px;box-shadow:0 2px 10px rgba(7,22,45,.18)}
.rh{margin:18px 0 8px;font-size:12px;letter-spacing:1px;color:#8A8F98}
.stick{position:sticky;bottom:0;background:linear-gradient(to top,#F5F5F7 78%,rgba(245,245,247,0));padding:14px 0 4px;margin-top:6px}.stick .btn{margin-top:6px}
.photos .cv{position:absolute;left:2px;bottom:2px;background:#0A84FF;color:#fff;font-size:10px;padding:0 5px;border-radius:99px;max-width:56px;overflow:hidden;white-space:nowrap}
/* v8.1 */
.cp{display:flex;gap:6px;align-items:center;margin-top:8px}
.cp input[type=color],.palform input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none;cursor:pointer}
.cp .hex,.palform .hex{width:86px;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-transform:uppercase;padding:6px 8px}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;border-radius:8px;background:#fff;border:1px solid rgba(7,22,45,.18);font-size:12px;font-weight:700;cursor:pointer;color:#07162D;white-space:nowrap}
.ib:hover{background:#EEF1F5}
.ib.wide{padding:0 12px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;border:1px solid rgba(7,22,45,.2);font-size:12px;font-weight:700;cursor:pointer;background:#fff}
.chip.on{outline:2.5px solid #0A84FF;outline-offset:2px}
.lays{display:flex;gap:8px;flex-wrap:wrap}
.lays canvas{width:48px;height:60px;border-radius:6px;border:1.5px solid rgba(7,22,45,.15);cursor:pointer}
.lays canvas.on{border-color:#0A84FF;box-shadow:0 0 0 2px #0A84FF}
.xp{position:absolute;left:8px;top:8px;background:#07162D;color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .15s}
.card:hover .xp{opacity:1}
@media (hover:none){.xp{opacity:1}}
.palform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ptile{display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;text-align:center}
.ptile u{cursor:pointer;font-size:11px;opacity:.6}
/* v8.2 : correctifs ergonomie */
.pv,.strip,.drop,.modes{flex:none}
#center>*{flex-shrink:0}
.stick .row2{display:flex;gap:6px}.stick .row2 .btn{flex:1;margin-top:6px;padding:10px 6px;font-size:13px}
@media (max-width:980px){
 #app{min-width:0;flex-direction:column;height:auto;min-height:100vh}
 #side{width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:4px;border-right:0;border-bottom:1px solid rgba(7,22,45,.1);flex:none}
 #side img.lg{width:74px;margin:0 8px 0 0;flex:none}.sh{display:none}.ni{white-space:nowrap;font-size:14px;padding:8px 11px;flex:none}
 #side div[style*="flex:1"]{display:none}
 #main{min-height:0}#body{flex-direction:column}
 #center{overflow:visible;padding:14px 10px}#insp{width:auto;border-left:0;border-top:1px solid rgba(7,22,45,.1);overflow:visible}
 .pv{max-width:100%}.pv[style]{width:min(440px,100%)!important}
 .cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}
 .stick{position:static;background:none}
}
.palform .btn{width:auto;margin:0}.cp{flex-wrap:wrap}
.bp .tagb{position:absolute;left:6px;bottom:6px;background:rgba(7,22,45,.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px;cursor:pointer;font-weight:600}.bp .tagb.on{background:#B57F35}.bp .tagb:hover{filter:brightness(1.15)}.chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;cursor:pointer;margin:22px 0 4px}.chk i{width:20px;height:20px;border-radius:6px;border:2px solid #07162D;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;line-height:1}.chk.on i{background:#07162D;color:#fff}.photos .p.tg{outline:2.5px solid #B57F35;outline-offset:-2px}</style></head><body>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(i){return document.getElementById(i)}
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function nid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ========== Authentification Supabase ========== */
function loadSession(){try{var r=localStorage.getItem(SESSION_KEY);if(r)session=JSON.parse(r)}catch(e){session=null}localMode=localStorage.getItem(LOCAL_KEY)==='1'&&!session}
function saveSession(s){session=s;try{localStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch(e){}}
function clearSession(){session=null;try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function dataHeaders(){var t=(session&&session.access_token)?session.access_token:SUPABASE_KEY;return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json'}}
async function authSignIn(email,password){var r=await fetch(AUTH_URL+'/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});var d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Identifiants invalides');saveSession({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user});return session}
async function authSignOut(){try{await fetch(AUTH_URL+'/logout',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(session?session.access_token:'')}})}catch(e){}clearSession()}
async function authRefresh(){if(!session||!session.refresh_token)return false;try{var r=await fetch(AUTH_URL+'/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});var d=await r.json();if(!r.ok)return false;saveSession({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user||session.user});return true}catch(e){return false}}
async function authFetch(url,o){o=o||{};var h=o.headers||{};var r=await fetch(url,Object.assign({},o,{headers:Object.assign({},dataHeaders(),h)}));if(r.status===401&&await authRefresh()){r=await fetch(url,Object.assign({},o,{headers:Object.assign({},dataHeaders(),h)}))}return r}
