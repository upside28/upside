<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upside — Outils internes</title>
<script>
  (function(){ var t; try { t = localStorage.getItem('upside-theme'); } catch(e){}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--nuit:#07162D;--nuit-2:#1B2A45;--or:#B57F35;--texte:#262626;--texte-2:#6B6B6B;--fond:#F2F3F5;--bord:#D5D9E0;--blanc:#fff;
  --surface:#fff;--survol:#F2F3F5;--titre:#07162D;--discret:#9AA0A8;--icone:#B8BEC8;--pastille:#F2F3F5;color-scheme:light}
:root[data-theme="dark"]{--texte:#E3E7EE;--texte-2:#9AA5B8;--fond:#0D1A2F;--bord:#24365A;
  --surface:#132239;--survol:#1B2D4A;--titre:#F3F5F8;--discret:#7D889C;--icone:#4A5B7A;--pastille:#1B2D4A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{transition:background .2s,color .2s;font-family:Aptos,'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fond);color:var(--texte);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* ---------- Bandeau ---------- */
.topbar{background:var(--nuit);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand-logo{height:26px;width:auto;display:block}
.brand-mark{color:var(--or);font-weight:800;letter-spacing:.32em;font-size:15px}
.brand-sep{width:1px;height:16px;background:var(--nuit-2);align-self:center}
.brand-name{color:#fff;font-size:14px;font-weight:500}
.admin-btn{background:transparent;border:1px solid var(--nuit-2);color:#C9CFDA;padding:7px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s,color .15s}
.admin-btn:hover{border-color:var(--or);color:#fff}
.top-actions{display:flex;gap:10px;align-items:center}
.admin-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- Héros (compact) ---------- */
.hero{background:var(--nuit);border-bottom:3px solid var(--or)}
.hero-inner{max-width:960px;margin:0 auto;padding:22px clamp(20px,4vw,48px) 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.greeting{color:#9AA5B8;font-size:13.5px;margin-bottom:4px}
.greeting strong{color:#fff;font-weight:600}
.hero h1{color:#fff;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.search{position:relative;flex:0 1 420px;min-width:240px}
.search input{width:100%;background:var(--nuit-2);border:1px solid #2C3D5C;border-radius:10px;padding:11px 46px 11px 42px;font:inherit;font-size:14.5px;color:#fff;outline:none;transition:border-color .15s,background .15s}
.search input::placeholder{color:#7D889C}
.search input:focus{border-color:var(--or);background:#16243D}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#7D889C;fill:none;stroke-width:2}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:#7D889C;border:1px solid #2C3D5C;border-radius:6px;padding:1px 7px}
.recents{max-width:960px;margin:0 auto;padding:0 clamp(20px,4vw,48px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recents:not(:empty){padding-top:18px}
.recents-label{color:var(--texte-2);font-size:13px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--bord);color:var(--titre);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;text-decoration:none;transition:border-color .15s}
.chip:hover{border-color:var(--or)}

/* ---------- Contenu ---------- */
main{max-width:960px;margin:0 auto;padding:28px clamp(20px,4vw,48px) 64px}
.list-head{display:flex;justify-content:space-between;font-size:13px;color:var(--texte-2);padding:0 4px 10px}
.list{background:var(--surface);border:1px solid var(--bord);border-radius:12px;padding:6px}
.card{display:grid;grid-template-columns:34px minmax(0,auto) minmax(0,1fr) auto 18px;align-items:center;gap:14px;padding:11px 14px;border-radius:8px;text-decoration:none;position:relative;transition:background .12s}
.card + .card::before{content:"";position:absolute;left:62px;right:14px;top:0;height:1px;background:var(--survol)}
.card:hover,.card:focus-visible,.card.kbd{background:var(--survol)}
.card:hover::before,.card:hover + .card::before,.card.kbd::before,.card.kbd + .card::before{opacity:0}
.card .ic{width:34px;height:34px;border-radius:8px;background:var(--pastille);display:grid;place-items:center;font-size:18px;line-height:1;transition:background .12s}
.card:hover .ic,.card.kbd .ic{background:var(--surface)}
.card .nm{font-size:15px;font-weight:500;color:var(--titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ds{font-size:13.5px;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .host{font-size:12.5px;color:var(--discret);white-space:nowrap}
.card .ext{width:15px;height:15px;stroke:var(--icone);fill:none;stroke-width:2;transition:stroke .12s}
.card:hover .ext,.card.kbd .ext{stroke:var(--or)}
@media (max-width:700px){
  .card{grid-template-columns:34px minmax(0,1fr) 18px;row-gap:2px}
  .card .ic{grid-row:span 2}
  .card .ds{grid-column:2;grid-row:2}
  .card .host{display:none}
  .card .ext{grid-column:3;grid-row:1 / span 2}
}
.state{padding:56px 20px;text-align:center;color:var(--texte-2);font-size:15px;background:var(--surface);border:1px dashed var(--bord);border-radius:12px}
.state button{margin-top:14px}
footer{max-width:960px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 36px;color:var(--discret);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- Administration ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(7,22,45,.6);backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.active{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(7,22,45,.6)}
.modal-head{background:var(--nuit);border-bottom:3px solid var(--or);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.modal-head h2{color:#fff;font-size:16px;font-weight:600}
.x{background:transparent;border:none;color:#9AA5B8;font-size:20px;cursor:pointer;line-height:1}
.x:hover{color:#fff}
.modal-body{padding:24px;overflow-y:auto}
.sec{font-size:14px;font-weight:600;color:var(--titre);margin:0 0 12px}
.sec + .hint{margin-top:-8px}
.hint{font-size:12.5px;color:var(--texte-2);margin-bottom:12px}
label{display:block;font-size:13px;font-weight:500;color:var(--texte-2);margin-bottom:6px}
.field{width:100%;border:1px solid var(--bord);border-radius:8px;padding:10px 13px;font:inherit;font-size:14px;color:var(--texte);outline:none;background:var(--surface)}
.field:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(181,127,53,.15)}
.row{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{font-size:13px;color:#B42318;min-height:18px;margin:6px 0 10px}
.btn{width:100%;background:var(--nuit);color:#fff;border:none;border-radius:8px;padding:12px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--nuit-2)}
.btn:disabled{background:#9AA0A8;cursor:not-allowed}
.btn.gold{background:var(--or);color:var(--nuit);font-weight:600}
.btn.gold:hover{background:#C48D42}
.btn.inline{width:auto;display:inline-flex;padding:10px 18px}
#admin-panel{display:none}
.alist{border:1px solid var(--bord);border-radius:10px;overflow:hidden;margin-bottom:26px}
.aitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bord)}
.aitem:nth-child(even){background:var(--survol)}
.aitem:last-child{border-bottom:none}
.aitem .info{flex:1;min-width:0}
.aitem .n{font-size:14px;font-weight:500;color:var(--titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .u{font-size:12px;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{background:var(--surface);border:1px solid var(--bord);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--texte-2);font-size:14px;flex-shrink:0}
.mini:hover:not(:disabled){border-color:var(--or);color:var(--titre)}
.mini:disabled{opacity:.35;cursor:default}
.emo-btn{width:36px;height:36px;border-radius:8px;border:1px dashed var(--bord);background:var(--pastille);font-size:19px;line-height:1;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.emo-btn:hover,.emo-btn.open{border-color:var(--or);border-style:solid}
.picker{padding:12px;border-bottom:1px solid var(--bord);background:var(--surface)}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;margin-bottom:10px}
.picker-grid button{height:36px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:19px;cursor:pointer}
.picker-grid button:hover,.picker-grid button.cur{background:var(--survol);border-color:var(--or)}
.picker-row{display:flex;gap:8px;align-items:center}
.picker-row .field{flex:1;padding:7px 10px}
.picker-row .btn{width:auto;padding:8px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--texte-2);border:1px solid var(--bord)}
.btn.ghost:hover{background:var(--survol);color:var(--titre)}
.del{background:var(--surface);border:1px solid #F1C0BA;color:#B42318;border-radius:6px;padding:0 10px;height:30px;font:inherit;font-size:12px;cursor:pointer;flex-shrink:0;min-width:84px}
.del:hover{background:rgba(180,35,24,.08)}
.del.arm{background:#B42318;color:#fff;border-color:#B42318}
.empty{font-size:13px;color:var(--texte-2);text-align:center;padding:18px}
.status{font-size:12.5px;text-align:center;margin-top:10px;min-height:16px}

@media (max-width:560px){.admin-btn .lbl{display:none}.admin-btn{padding:7px 10px}}
@media (max-width:820px){
  .search{flex:1 1 100%}
  .row2{grid-template-columns:1fr}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  [/scor/i,                    '🎯', 'Études & analyses',     'Scoring et notation des immeubles'],
  [/bail|baux/i,               '📜', 'Études & analyses',     'Analyse et qualification des baux'],
  [/carto|carte/i,             '🗺️', 'Études & analyses',     'Carte de l\'offre d\'immeubles'],
  [/fiche|immeuble|broker/i,   '🏢', 'Études & analyses',     'Fiches immeubles à partir des descriptifs'],
  [/insta|atelier|visuel/i,    '📸', 'Communication',         'Créer les visuels Instagram'],
  [/charge|budget|r[ée]gul/i,  '🧮', 'Gestion d\'actifs',     'Régularisation de charges et budgets']
];
const EXT = '<svg viewBox="0 0 24 24" class="ext"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const ORDER = ['Transactions','Études & analyses','Travaux & chantiers','Gestion d\'actifs','Équipe & organisation','Communication','Autres outils'];

function meta(t){
  const r = RULES.find(x => x[0].test(t.name)) || [null,'🧰','Autres outils',''];
  return { icon:(t.emoji||'').trim() || r[1], cat:(t.category||'').trim() || r[2], desc:(t.description||'').trim() || r[3] };
}

/* ---------- Utilitaires ---------- */
let tools = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const host = u => { try { return new URL(u).host.replace(/^www\./,''); } catch(e){ return ''; } };
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* Salutation */
(function(){
  const d = new Date(), h = d.getHours();
  const date = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('greeting').innerHTML = '<strong>' + (h < 18 ? 'Bonjour' : 'Bonsoir') + '</strong>, nous sommes le ' + esc(date) + '.';
})();

/* ---------- Récemment ouverts (mémorisés dans ce navigateur) ---------- */
const RKEY = 'upside-outils-recents';
function getRecents(){ try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch(e){ return []; } }
function pushRecent(url){
  try {
    const r = getRecents().filter(u => u !== url); r.unshift(url);
    localStorage.setItem(RKEY, JSON.stringify(r.slice(0,4)));
  } catch(e){}
  renderRecents();
}
function renderRecents(){
  const list = getRecents().map(u => tools.find(t => t.url === u)).filter(Boolean);
  const box = $('recents');
  if (!list.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<span class="recents-label">Récemment ouverts</span>' + list.map(t =>
    '<a class="chip" href="'+esc(safeUrl(t.url))+'" target="_blank" rel="noopener noreferrer" data-url="'+esc(t.url)+'">'+'<span>'+esc(meta(t).icon)+'</span>'+esc(t.name)+'</a>').join('');
}

function hl(i){
  document.querySelectorAll('.card.kbd').forEach(c => c.classList.remove('kbd'));
  const c = document.querySelector('.card[data-i="'+i+'"]'); if (c) c.classList.add('kbd');
}

/* ---------- Grille des outils ---------- */
function render(){
  const q = norm($('q').value.trim());
  window.__order = tools.slice();
  const main = $('main');
  if (!tools.length){
    main.innerHTML = '<div class="state">Aucun outil n\'est encore référencé.<br><button class="btn inline" type="button" onclick="openAdmin()">Ajouter un outil</button></div>';
    $('count').textContent = ''; return;
  }
  const items = tools.filter(t => { const m = meta(t); return !q || norm(t.name+' '+m.desc+' '+m.cat).includes(q); });
  main.innerHTML = items.length
    ? '<div class="list-head"><span>Outils</span><span>' + items.length + ' sur ' + tools.length + '</span></div><div class="list">' + items.map(t => {
        const m = meta(t), i = tools.indexOf(t);
        return '<a class="card" data-i="'+i+'" href="'+esc(safeUrl(t.url))+'" target="_blank" rel="noopener noreferrer">' +
          '<span class="ic" aria-hidden="true">'+esc(m.icon)+'</span>' +
          '<span class="nm">'+esc(t.name)+'</span>' +
          '<span class="ds">'+esc(m.desc)+'</span>' +
          '<span class="host">'+esc(host(t.url))+'</span>' + EXT + '</a>';
      }).join('') + '</div>'
    : '<div class="state">Aucun outil ne correspond à « '+esc($('q').value.trim())+' ». Essayez un autre mot, par exemple « bail » ou « chantier ».</div>';
  $('count').textContent = tools.length + ' outil' + (tools.length>1?'s':'') + ' référencé' + (tools.length>1?'s':'');
  renderRecents();
}

function openTool(t){ if (!t) return; pushRecent(t.url); window.open(safeUrl(t.url), '_blank', 'noopener'); }

document.addEventListener('click', e => {
  const a = e.target.closest('a.card, a.chip');
  if (!a) return;
  const url = a.dataset.url || (window.__order[+a.dataset.i] || {}).url;
  if (url) pushRecent(url);
});
document.addEventListener('mouseover', e => { const c = e.target.closest('.card'); if (c) hl(+c.dataset.i); });
document.addEventListener('mouseout', e => { if (e.target.closest('.card') && !e.relatedTarget?.closest?.('.card')) hl(-1); });

/* Recherche : « / » pour chercher, Entrée ouvre le premier résultat, Échap efface */
$('q').addEventListener('input', render);
$('q').addEventListener('keydown', e => {
  const cards = [...document.querySelectorAll('.card')];
  if (e.key === 'ArrowDown' && cards[0]){ e.preventDefault(); cards[0].focus(); }
  if (e.key === 'Enter'){ const c = cards[0]; if (c) openTool(window.__order[+c.dataset.i]); }
  if (e.key === 'Escape'){ $('q').value = ''; render(); $('q').blur(); }
});
document.addEventListener('keydown', e => {
  const cur = document.activeElement;
  if (cur && cur.classList && cur.classList.contains('card') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    e.preventDefault();
    const nxt = e.key === 'ArrowDown' ? cur.nextElementSibling : cur.previousElementSibling;
    if (nxt) nxt.focus(); else if (e.key === 'ArrowUp') $('q').focus();
  }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && !$('overlay').classList.contains('active')){ e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && $('overlay').classList.contains('active')) closeAdmin();
});

/* ---------- Mode clair / sombre ---------- */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function paintThemeBtn(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('theme-btn').innerHTML = (dark ? SUN : MOON) + '<span class="lbl">' + (dark ? 'Mode clair' : 'Mode sombre') + '</span>';
}
$('theme-btn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('upside-theme', next); } catch(e){}
  paintThemeBtn();
});
paintThemeBtn();

/* ---------- JSONBin ---------- */
async function loadTools(){
  const res = await fetch(BIN_URL + '/latest', { headers:{ 'X-Master-Key':API_KEY } });
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  tools = (data.record && data.record.tools) || [];
  render();
}
async function saveTools(){
  const res = await fetch(BIN_URL, { method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key':API_KEY }, body:JSON.stringify({ tools }) });
  if (!res.ok) throw new Error(res.status);
}

/* ---------- Administration ---------- */
function setStatus(msg, color){
  const el = $('status'); el.textContent = msg; el.style.color = color || 'var(--texte-2)';
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
}
function renderAdmin(){
  const c = $('alist');
  pickerFor = -1;
  $('cats').innerHTML = [...new Set(ORDER.concat(tools.map(t => meta(t).cat)))].map(x => '<option value="'+esc(x)+'">').join('');
  if (!tools.length){ c.innerHTML = '<div class="empty">Aucun outil enregistré.</div>'; return; }
  c.innerHTML = tools.map((t,i) =>
    '<div class="aitem" data-row="'+i+'"><button class="emo-btn" data-emo="'+i+'" title="Changer l\'emoji" aria-label="Changer l\'emoji de '+esc(t.name)+'">'+esc(meta(t).icon)+'</button><div class="info"><div class="n">'+esc(t.name)+' <span style="color:var(--texte-2);font-weight:400">· '+esc(meta(t).cat)+'</span></div><div class="u">'+esc(t.url)+'</div></div>' +
    '<button class="mini" data-up="'+i+'" '+(i===0?'disabled':'')+' aria-label="Monter">↑</button>' +
    '<button class="mini" data-down="'+i+'" '+(i===tools.length-1?'disabled':'')+' aria-label="Descendre">↓</button>' +
    '<button class="del" data-del="'+i+'">Supprimer</button></div>').join('');
}
/* ---------- Choix de l'emoji ---------- */
const EMOJIS = ['📈','📊','📉','🧮','💶','🏢','🏬','🏗️','🏠','🔑','📜','📝','✍️','📋','📁','🗂️','📄','🗺️','📍','🚇','🚗','👥','👷','🤝','📅','⚖️','🎯','🔍','🤖','💡','📸','🎨','⚙️','🛠️','🔔','⭐','🌱','⚡','🧰','🔗'];
let pickerFor = -1;
function openPicker(i){
  document.querySelectorAll('.picker').forEach(x => x.remove());
  document.querySelectorAll('.emo-btn.open').forEach(x => x.classList.remove('open'));
  if (pickerFor === i){ pickerFor = -1; return; }
  pickerFor = i;
  const row = document.querySelector('.aitem[data-row="'+i+'"]');
  row.querySelector('.emo-btn').classList.add('open');
  const cur = meta(tools[i]).icon;
  const d = document.createElement('div');
  d.className = 'picker';
  d.innerHTML = '<div class="picker-grid">' + EMOJIS.map(e => '<button type="button" data-pick="'+e+'"'+(e===cur?' class="cur"':'')+'>'+e+'</button>').join('') + '</div>' +
    '<div class="picker-row"><input class="field" id="emo-free" maxlength="8" placeholder="Autre emoji (Windows : ⊞ + .)">' +
    '<button type="button" class="btn" data-pick-free="1">Valider</button>' +
    '<button type="button" class="btn ghost" data-pick-auto="1" title="Revenir à l\'emoji choisi d\'après le nom">Automatique</button></div>';
  row.after(d);
  $('emo-free').addEventListener('keydown', e => { if (e.key === 'Enter') d.querySelector('[data-pick-free]').click(); });
}
async function setEmoji(i, v){
  const backup = JSON.parse(JSON.stringify(tools));
  if (v) tools[i].emoji = v; else delete tools[i].emoji;
  renderAdmin(); render();
  try { await saveTools(); setStatus('Emoji enregistré.', '#127A43'); }
  catch(e){ tools = backup; renderAdmin(); render(); setStatus('Enregistrement impossible. Vérifiez la connexion et réessayez.', '#B42318'); }
}

$('alist').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.emo !== undefined){ openPicker(+b.dataset.emo); return; }
  if (b.dataset.pick){ setEmoji(pickerFor, b.dataset.pick); return; }
  if (b.dataset.pickFree){ const v = $('emo-free').value.trim(); if (v) setEmoji(pickerFor, v); return; }
  if (b.dataset.pickAuto){ setEmoji(pickerFor, ''); return; }
  const backup = JSON.parse(JSON.stringify(tools));
  try {
    if (b.dataset.up){ const i = +b.dataset.up; [tools[i-1],tools[i]] = [tools[i],tools[i-1]]; }
    else if (b.dataset.down){ const i = +b.dataset.down; [tools[i+1],tools[i]] = [tools[i],tools[i+1]]; }
    else if (b.dataset.del){
      // Double clic pour confirmer la suppression
      if (!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent = 'Confirmer'; setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Supprimer'; }, 3000); return; }
      tools.splice(+b.dataset.del, 1);
    } else return;
    renderAdmin(); render();
    await saveTools(); setStatus('Modifications enregistrées.', '#127A43');
  } catch(err){ tools = backup; renderAdmin(); render(); setStatus('Enregistrement impossible. Vérifiez la connexion et réessayez.', '#B42318'); }
});

function openAdmin(){
  $('overlay').classList.add('active');
  $('pwd-screen').style.display = 'block'; $('admin-panel').style.display = 'none';
  $('pwd').value = ''; $('pwd-err').textContent = '';
  setTimeout(() => $('pwd').focus(), 60);
}
function closeAdmin(){ $('overlay').classList.remove('active'); }
function checkPwd(){
  if ($('pwd').value === PASSWORD){ $('pwd-screen').style.display = 'none'; $('admin-panel').style.display = 'block'; renderAdmin(); setTimeout(() => $('n-name').focus(), 60); }
  else { $('pwd-err').textContent = 'Mot de passe incorrect.'; $('pwd').select(); }
}
async function addTool(){
  const name = $('n-name').value.trim(), raw = $('n-url').value.trim();
  if (!name || !raw){ setStatus('Renseignez au moins le nom et le lien.', '#B42318'); return; }
  const t = { name, url: /^https?:\/\//i.test(raw) ? raw : 'https://' + raw };
  const cat = $('n-cat').value.trim(), desc = $('n-desc').value.trim(), emo = $('n-emoji').value.trim();
  if (cat) t.category = cat; if (desc) t.description = desc; if (emo) t.emoji = emo;
  $('add-btn').disabled = true; setStatus('Enregistrement…');
  try {
    tools.push(t); await saveTools();
    ['n-name','n-url','n-cat','n-desc','n-emoji'].forEach(id => $(id).value = '');
    setStatus('Outil ajouté.', '#127A43'); renderAdmin(); render();
  } catch(e){ tools.pop(); setStatus('Ajout impossible. Vérifiez la connexion et réessayez.', '#B42318'); }
  finally { $('add-btn').disabled = false; }
}

$('admin-btn').addEventListener('click', openAdmin);
$('close').addEventListener('click', closeAdmin);
$('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeAdmin(); });
$('pwd-btn').addEventListener('click', checkPwd);
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') checkPwd(); });
$('add-btn').addEventListener('click', addTool);
['n-url','n-desc'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addTool(); }));

loadTools().catch(() => {
  $('main').innerHTML = '<div class="state">La liste des outils n\'a pas pu être chargée. Vérifiez votre connexion puis rechargez la page.</div>';
});
</script>
</body>
</html>
