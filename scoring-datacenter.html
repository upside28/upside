<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upside+ — Scoring Foncier Data Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Aptos:wght@300;400;500;600;700&display=swap');
  :root{
    --nuit:#1a2235; --nuit-2:#253350; --or:#c9a84c; --or-soft:rgba(201,168,76,0.1);
    --fond:#eef0f3; --blanc:#ffffff; --gris:#6b7280; --gris-c:#9ca3af;
    --bord:#e5e7eb; --bord-2:#d1d5db; --sep:#f3f4f6;
    --vert:#16a34a; --rouge:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Aptos','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fond);min-height:100vh;color:var(--nuit);}
  header{background:var(--nuit);padding:0 40px;height:56px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .logo img{height:28px;width:auto;filter:invert(1);}
  .logo .tool-tag{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gris-c);}
  .header-right{font-size:12px;color:var(--gris-c);}

  main{max-width:1100px;margin:0 auto;padding:40px;transition:max-width .2s;}
  main.home-wide{max-width:1440px;}
  .section-label{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gris);margin-bottom:8px;}
  .page-title{font-size:32px;font-weight:700;color:var(--nuit);margin-bottom:8px;}
  .page-subtitle{font-size:15px;color:var(--gris);margin-bottom:32px;}

  /* ===== PAGE D'ACCUEIL — HERO ===== */
  .home-hero{
    position:relative;width:100%;aspect-ratio:940/529;border-radius:14px;overflow:hidden;
    margin-bottom:40px;border:1px solid var(--bord);box-shadow:0 8px 32px rgba(26,34,53,0.18);
    background:var(--banner-img,linear-gradient(135deg,#1a2235 0%,#253350 100%));
    background-size:cover;background-position:center;display:flex;align-items:center;
  }
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(26,34,53,0.86) 0%,rgba(26,34,53,0.55) 45%,rgba(26,34,53,0.15) 100%);}
  .hero-content{position:relative;z-index:2;padding:0 6%;max-width:62%;}
  .hero-title{font-size:clamp(24px,3.4vw,46px);font-weight:700;line-height:1.12;color:#fff;letter-spacing:-0.01em;}
  .intro-eyebrow{font-size:clamp(11px,1.1vw,14px);font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--or);margin-bottom:16px;}

  .home-intro{background:var(--blanc);border:1px solid var(--bord);border-left:3px solid var(--or);border-radius:8px;padding:28px 32px;margin-bottom:48px;box-shadow:0 2px 12px rgba(26,34,53,0.05);}
  .intro-text p{font-size:16px;line-height:1.7;color:#4b5563;margin-bottom:16px;}
  .intro-text p:last-child{margin-bottom:0;}

  .projects-section{border-top:1px solid var(--bord);padding-top:32px;}
  .projects-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .projects-title{font-size:18px;font-weight:600;color:var(--nuit);}

  /* Boutons */
  .btn-primary{background:var(--nuit);color:#fff;border:none;border-radius:6px;padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:inherit;}
  .btn-primary:hover{background:var(--nuit-2);}
  .btn-primary:disabled{background:var(--gris-c);cursor:not-allowed;}
  .btn-primary svg{width:15px;height:15px;stroke:var(--or);fill:none;stroke-width:2;stroke-linecap:round;}
  .btn-ghost{background:transparent;border:1px solid var(--or);color:var(--or);padding:9px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
  .btn-ghost:hover{background:var(--or-soft);}

  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .project-card{background:var(--blanc);border-radius:10px;padding:24px;border:1px solid var(--bord);cursor:pointer;transition:border-color .15s,transform .12s;display:flex;flex-direction:column;gap:8px;position:relative;}
  .project-card:hover{border-color:var(--or);transform:translateY(-2px);}
  .project-card .pc-name{font-size:16px;font-weight:600;color:var(--nuit);}
  .project-card .pc-adr{font-size:13px;color:var(--gris);min-height:18px;}
  .project-card .pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .project-card .pc-score{font-size:13px;font-weight:600;color:var(--or);}
  .project-card .pc-del{position:absolute;top:14px;right:14px;background:transparent;border:1px solid #fca5a5;color:var(--rouge);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s;}
  .project-card:hover .pc-del{opacity:1;}
  .project-card .pc-del:hover{background:#fef2f2;}
  .state-msg{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--gris-c);font-size:15px;}

  /* Onglets projet */
  .proj-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:28px;}
  .tab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--gris);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--nuit);border-bottom-color:var(--or);}
  .tab:hover:not(.active){color:var(--nuit);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* Tables barème / saisie */
  .dim-block{background:var(--blanc);border:1px solid var(--bord);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .dim-head{background:var(--nuit);color:#fff;padding:12px 20px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .dim-head .dim-max{font-size:12px;color:var(--gris-c);font-weight:500;}
  .crit-row{padding:14px 20px;border-bottom:1px solid var(--sep);}
  .crit-row:last-child{border-bottom:none;}
  .crit-label{font-size:14px;font-weight:500;color:var(--nuit);margin-bottom:8px;}
  table.bareme{width:100%;border-collapse:collapse;}
  table.bareme td{padding:5px 0;font-size:13px;color:var(--gris);}
  table.bareme td.pts{text-align:right;font-weight:600;color:var(--nuit);width:60px;}

  select{width:100%;border:1px solid var(--bord-2);border-radius:6px;padding:9px 13px;font-size:14px;color:var(--nuit);outline:none;font-family:inherit;background:#fff;}
  select:focus{border-color:var(--or);}
  .crit-foot{display:flex;justify-content:flex-end;margin-top:8px;}
  .crit-pts{font-size:13px;color:var(--gris);}
  .crit-pts b{color:var(--nuit);}
  .dim-subtotal{padding:10px 20px;background:var(--fond);font-size:13px;font-weight:600;display:flex;justify-content:space-between;}

  .score-bar-wrap{background:var(--nuit);border-radius:10px;padding:20px 24px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:24px;box-shadow:0 4px 16px rgba(26,34,53,0.18);}
  .score-bar-wrap .lab{font-size:14px;}
  .score-bar-wrap .val{font-size:22px;font-weight:700;color:var(--or);}

  /* Résultat */
  .res-hero{background:var(--blanc);border:1px solid var(--bord);border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;}
  .res-score{font-size:56px;font-weight:700;color:var(--nuit);line-height:1;}
  .res-score span{font-size:24px;color:var(--gris-c);}
  .res-level{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:600;}
  .res-segment{font-size:15px;color:var(--gris);margin-top:14px;}
  .res-reco{background:var(--blanc);border:1px solid var(--bord);border-left:3px solid var(--or);border-radius:8px;padding:20px 24px;font-size:14px;line-height:1.6;color:var(--nuit);}
  .res-reco .rr-lab{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);margin-bottom:8px;}
  .res-dim-recos{margin-top:22px;}
  .res-dim-recos .rdr-title{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);margin-bottom:12px;}
  .dim-reco-block{background:var(--blanc);border:1px solid var(--bord);border-left:3px solid var(--rouge);border-radius:8px;padding:14px 18px;margin-bottom:12px;}
  .dim-reco-block .drb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;}
  .dim-reco-block .drb-name{font-size:14px;font-weight:600;color:var(--nuit);}
  .dim-reco-block .drb-score{font-size:12px;font-weight:600;color:var(--rouge);white-space:nowrap;}
  .dim-reco-block .drb-text{font-size:13.5px;line-height:1.55;color:var(--nuit);}
  .grille{margin-top:28px;}
  .grille table{width:100%;border-collapse:collapse;background:var(--blanc);border:1px solid var(--bord);border-radius:8px;overflow:hidden;}
  .grille th{background:var(--nuit);color:#fff;font-size:12px;font-weight:600;text-align:left;padding:10px 14px;}
  .grille td{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--sep);vertical-align:top;color:var(--gris);}
  .grille tr.cur td{background:var(--or-soft);color:var(--nuit);font-weight:500;}

  /* Modale */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
  .overlay.active{display:flex;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:480px;margin:20px;overflow:hidden;}
  .modal-header{background:var(--nuit);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;}
  .modal-header h2{font-size:16px;font-weight:600;color:#fff;}
  .modal-close{background:transparent;border:none;color:var(--gris-c);font-size:20px;cursor:pointer;}
  .modal-close:hover{color:#fff;}
  .modal-body{padding:24px;}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:13px;font-weight:500;color:var(--gris);margin-bottom:5px;}
  .form-row input{width:100%;border:1px solid var(--bord-2);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--nuit);outline:none;font-family:inherit;}
  .form-row input:focus{border-color:var(--or);}
  .status-msg{font-size:12px;text-align:center;margin-top:10px;min-height:16px;}

  .badge-sync{font-size:12px;color:var(--gris-c);display:flex;align-items:center;gap:6px;}
  .badge-sync.saved{color:var(--vert);}
  .badge-sync.saving{color:var(--or);}
  .badge-sync.error{color:var(--rouge);}

  /* Barème éditable — grille alignée */
  .pts-input{width:72px;border:1px solid var(--bord-2);border-radius:5px;padding:6px 8px;font-size:13px;text-align:center;font-family:inherit;color:var(--nuit);outline:none;}
  .pts-input:focus{border-color:var(--or);}
  .opt-line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--sep);}
  .opt-line:last-child{border-bottom:none;}
  .opt-line .opt-lab{font-size:13px;color:var(--gris);line-height:1.4;flex:1;}
  .opt-line .opt-pts{flex:0 0 auto;display:flex;align-items:center;gap:7px;}
  .opt-line .opt-pts .unit{font-size:11px;color:var(--gris-c);width:24px;}
  .crit-head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;}
  .crit-head-row .crit-max{font-size:12px;font-weight:600;color:var(--or);white-space:nowrap;}
  .dim-warn{font-size:12px;color:var(--rouge);padding:8px 20px;background:#fef2f2;display:none;}
  .dim-warn.show{display:block;}
  .panel-intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-intro p{font-size:13px;color:var(--gris);max-width:640px;}
  .total-pill{font-size:13px;font-weight:600;color:var(--nuit);background:var(--fond);border:1px solid var(--bord);border-radius:6px;padding:8px 14px;white-space:nowrap;}
  .total-pill.bad{color:var(--rouge);border-color:#fca5a5;background:#fef2f2;}

  /* Seuils éditables */
  .seuil-edit-table{width:100%;border-collapse:collapse;background:var(--blanc);border:1px solid var(--bord);border-radius:8px;overflow:hidden;}
  .seuil-edit-table th{background:var(--nuit);color:#fff;font-size:12px;font-weight:600;text-align:left;padding:10px 12px;}
  .seuil-edit-table td{padding:8px 12px;border-bottom:1px solid var(--sep);vertical-align:top;}
  .seuil-edit-table input,.seuil-edit-table textarea{width:100%;border:1px solid var(--bord-2);border-radius:5px;padding:6px 9px;font-size:13px;font-family:inherit;color:var(--nuit);outline:none;}
  .seuil-edit-table textarea{resize:vertical;overflow:hidden;line-height:1.45;min-height:38px;}
  .seuil-edit-table input:focus,.seuil-edit-table textarea:focus{border-color:var(--or);}
  .seuil-edit-table input.min-in{width:64px;text-align:right;}
  .seuil-edit-table input.color-in{width:46px;height:32px;padding:2px;cursor:pointer;}
  .btn-reset{background:transparent;border:1px solid var(--bord-2);color:var(--gris);padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-reset:hover{border-color:var(--rouge);color:var(--rouge);}

  /* Connexion */
  .login-wrap{max-width:420px;margin:6vh auto 0;}
  .login-card{background:var(--blanc);border:1px solid var(--bord);border-top:3px solid var(--or);border-radius:12px;padding:36px 34px;box-shadow:0 8px 32px rgba(26,34,53,0.10);}
  .login-card h1{font-size:22px;font-weight:700;color:var(--nuit);margin-bottom:6px;}
  .login-card .sub{font-size:14px;color:var(--gris);margin-bottom:26px;}
  .login-card .form-row{margin-bottom:16px;}
  .login-card label{display:block;font-size:13px;font-weight:500;color:var(--gris);margin-bottom:5px;}
  .login-card input{width:100%;border:1px solid var(--bord-2);border-radius:6px;padding:11px 14px;font-size:14px;color:var(--nuit);outline:none;font-family:inherit;}
  .login-card input:focus{border-color:var(--or);}
  .login-card .btn-primary{width:100%;justify-content:center;padding:12px;margin-top:8px;}
  .login-err{font-size:13px;color:var(--rouge);min-height:18px;margin-top:12px;text-align:center;}
  .login-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--or);margin-bottom:14px;}

  /* En-tête utilisateur */
  .user-chip{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--gris-c);}
  .user-chip .who{color:#fff;font-weight:500;}
  .btn-logout{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
  .btn-logout:hover{border-color:var(--or);color:var(--or);}

  /* Vue admin — accès clients */
  .access-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .access-card{background:var(--blanc);border:1px solid var(--bord);border-radius:10px;padding:22px;cursor:pointer;transition:border-color .15s,transform .12s;position:relative;}
  .access-card:hover{border-color:var(--or);transform:translateY(-2px);}
  .access-card .ac-ent{font-size:16px;font-weight:600;color:var(--nuit);margin-bottom:4px;}
  .access-card .ac-mail{font-size:13px;color:var(--gris);word-break:break-all;}
  .access-card .ac-date{font-size:12px;color:var(--gris-c);margin-top:10px;}
  .pwd-reveal{background:var(--nuit);border:1px solid var(--or);border-radius:8px;padding:16px 18px;margin-top:14px;}
  .pwd-reveal .pl{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris-c);margin-bottom:6px;}
  .pwd-reveal .pv{font-family:'Courier New',monospace;font-size:18px;font-weight:700;color:var(--or);letter-spacing:0.04em;user-select:all;}
  .pwd-reveal .ph{font-size:12px;color:var(--gris-c);margin-top:8px;line-height:1.5;}
  .admin-detail{background:var(--blanc);border:1px solid var(--bord);border-radius:10px;padding:24px;margin-bottom:24px;}
  .admin-detail .ad-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--sep);font-size:14px;}
  .admin-detail .ad-row:last-child{border-bottom:none;}
  .admin-detail .ad-k{color:var(--gris);}
  .admin-detail .ad-v{color:var(--nuit);font-weight:500;text-align:right;word-break:break-all;}

  /* Onglets de l'espace administrateur */
  .admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:28px;}
  .admin-tabs .atab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--gris);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .admin-tabs .atab.active{color:var(--nuit);border-bottom-color:var(--or);}
  .admin-tabs .atab:hover:not(.active){color:var(--nuit);}

  /* Zone de danger */
  .danger-zone{background:#fef2f2;border:1px solid #fca5a5;border-left:3px solid var(--rouge);border-radius:8px;padding:20px 22px;margin-top:28px;}
  .danger-zone .dz-title{font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--rouge);margin-bottom:8px;}
  .danger-zone .dz-text{font-size:13px;color:#7f1d1d;line-height:1.55;margin-bottom:14px;}
  .btn-danger{background:var(--rouge);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
  .btn-danger:hover{background:#b91c1c;}
  .btn-danger:disabled{background:var(--gris-c);cursor:not-allowed;}
  .dz-confirm{margin-top:14px;}
  .dz-confirm label{display:block;font-size:13px;color:#7f1d1d;margin-bottom:6px;}
  .dz-confirm input{width:100%;border:1px solid #fca5a5;border-radius:6px;padding:9px 13px;font-size:14px;font-family:inherit;color:var(--nuit);outline:none;background:#fff;}
  .dz-confirm input:focus{border-color:var(--rouge);}
  .dz-actions{display:flex;gap:10px;margin-top:14px;}
</style>

<!-- ===== IMAGE BANNIÈRE PAGE D'ACCUEIL =====
     Image intégrée en base64 ci-dessous via --banner-img.

<script>
/* =========================================================================
   CONFIGURATION SUPABASE
   ========================================================================= */
const SUPABASE_URL = 'https://mlldlluaehzrzktxxrqp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vZKT85ZleficJ9kH76OmaA_HiT4B6O6';
const TABLE = 'projets';
const REST = SUPABASE_URL + '/rest/v1/' + TABLE;
const REST_CONFIG = SUPABASE_URL + '/rest/v1/config_globale';
const AUTH_URL = SUPABASE_URL + '/auth/v1';
const FN_CREATE_CLIENT = SUPABASE_URL + '/functions/v1/create-client';
const ADMIN_EMAIL = 'mroux@upside.paris';
const SESSION_KEY = 'upside_dc_session';

/* ---- Session courante (jeton JWT de l'utilisateur connecté) ---- */
let session = null;        // { access_token, refresh_token, user:{id,email} }
let isAdmin = false;

function loadSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); if(raw){ session = JSON.parse(raw); } }
  catch(e){ session = null; }
  isAdmin = !!(session && session.user && session.user.email === ADMIN_EMAIL);
}
function saveSession(s){
  session = s;
  isAdmin = !!(s && s.user && s.user.email === ADMIN_EMAIL);
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){}
}
function clearSession(){
  session = null; isAdmin = false;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

/* En-têtes des requêtes de données : le jeton de l'utilisateur connecté
   remplace la clé publishable en Authorization, pour que la RLS lise auth.uid(). */
function dataHeaders(){
  const token = (session && session.access_token) ? session.access_token : SUPABASE_KEY;
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };
}

/* ---- Authentification ---- */
async function authSignIn(email, password){
  const r = await fetch(AUTH_URL + '/token?grant_type=password', {
    method:'POST',
    headers:{ 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error_description || data.msg || 'Identifiants invalides');
  saveSession({ access_token:data.access_token, refresh_token:data.refresh_token, user:data.user });
  return session;
}
async function authSignOut(){
  try{
    await fetch(AUTH_URL + '/logout', {
      method:'POST',
      headers:{ 'apikey': SUPABASE_KEY, 'Authorization':'Bearer '+(session?session.access_token:'') }
    });
  }catch(e){}
  clearSession();
}

/* ---- Appels à l'Edge Function (réservés à l'admin) ---- */
async function fnCall(payload){
  const r = await fetch(FN_CREATE_CLIENT, {
    method:'POST',
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization':'Bearer '+(session?session.access_token:''), 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || 'Erreur fonction');
  return data;
}

/* Recommandations par dimension. Une recommandation se déclenche dans l'onglet
   Résultat lorsqu'au moins une réponse est saisie dans la dimension ET que le
   sous-total obtenu est inférieur ou égal au seuil (exprimé en points).
   Le seuil par défaut vaut la moitié du maximum de la dimension. */
const RECOS_TEXT_DEFAULT = [
  "Prendre contact avec RTE et lancer une étude exploratoire, se munir d'un bureau d'étude spécialisé.",
  "Prendre contact avec un architecte pour évaluer la capacité d'accueil réelle sur ce foncier contraint, prendre en charge d'éventuels travaux de démolition et d'aménagement pour améliorer l'attractivité du terrain pour un futur investisseur.",
  "Explorer le déploiement d'une fibre auprès de l'opérateur local (Orange par exemple).",
  "Intégrer dans le programme des solutions waterless, interroger des contracteurs de datacenters pour connaître les technologies les moins impactantes.",
  "Procéder à une étude trafic pour connaître l'impact de l'activité sur le trafic actuel, faire chiffrer les travaux d'aménagement nécessaires à l'implantation de l'équipement.",
  "Prendre contact avec les services de l'urbanisme pour une éventuelle évolution du PLU.",
  "Mettre en place un plan de concertation avec les élus locaux et les administrations concernées.",
  "Mettre en place un plan de diagnostics sites et sols pollués pour connaître « l'état initial » et mesurer le montant des travaux de remédiation des sols."
];

/* Construit les recommandations par défaut alignées sur un barème donné :
   un seuil par dimension (moitié du max, arrondi à l'inférieur) + le texte. */
function recosDefaultFor(bareme){
  return bareme.map((d,i)=>({
    seuil: Math.floor(dimMaxComputed(d)/2),
    texte: RECOS_TEXT_DEFAULT[i] || ""
  }));
}

const clone = (o)=>JSON.parse(JSON.stringify(o));

/* =========================================================================
   RÉFÉRENTIEL CENTRAL (barème, seuils, recommandations)
   Partagé par tous les projets. Stocké dans la table config_globale (id=1).
   Seul l'administrateur peut l'écrire ; tous les comptes le lisent.
   Les projets ne stockent plus que leur saisie et leur score (recalculé).
   ========================================================================= */
let CONFIG = { bareme: clone(BAREME_DEFAULT), seuils: clone(SEUILS_DEFAULT), recos: recosDefaultFor(BAREME_DEFAULT) };

/* Normalise un objet config chargé : complète les champs manquants ou vides
   à partir des valeurs par défaut, et réaligne les recos sur le barème. */
function normalizeConfig(c){
  const out = {};
  out.bareme = (c && Array.isArray(c.bareme) && c.bareme.length) ? c.bareme : clone(BAREME_DEFAULT);
  out.seuils = (c && Array.isArray(c.seuils) && c.seuils.length) ? c.seuils : clone(SEUILS_DEFAULT);
  const def = recosDefaultFor(out.bareme);
  if(c && Array.isArray(c.recos) && c.recos.length === out.bareme.length){
    out.recos = def.map((d,i)=>({
      seuil: (typeof c.recos[i].seuil==='number') ? c.recos[i].seuil : d.seuil,
      texte: (typeof c.recos[i].texte==='string') ? c.recos[i].texte : d.texte
    }));
  } else { out.recos = def; }
  return out;
}

/* Charge le référentiel depuis Supabase. En cas d'absence de ligne ou d'erreur,
   on retombe sur les valeurs par défaut afin que l'outil reste utilisable. */
async function loadConfig(){
  try{
    const r = await fetch(REST_CONFIG + '?id=eq.1&select=bareme,seuils,recos', {headers:dataHeaders()});
    if(r.ok){
      const rows = await r.json();
      const row = rows && rows[0] ? rows[0] : null;
      const empty = !row || !(Array.isArray(row.bareme) && row.bareme.length);
      CONFIG = normalizeConfig(row);
      // Première utilisation : si la ligne de config est vide et que c'est l'admin,
      // on persiste les valeurs par défaut pour que les clients lisent un référentiel complet.
      if(empty && isAdmin){
        try{ await saveConfig(); }catch(e){}
      }
    } else {
      CONFIG = normalizeConfig(null);
    }
  }catch(e){ CONFIG = normalizeConfig(null); }
}

/* Enregistre le référentiel (réservé à l'admin par la RLS). */
async function saveConfig(){
  const body = { id:1, bareme:CONFIG.bareme, seuils:CONFIG.seuils, recos:CONFIG.recos, updated_at:new Date().toISOString() };
  const r = await fetch(REST_CONFIG + '?on_conflict=id', {
    method:'POST',
    headers:{...dataHeaders(), 'Prefer':'resolution=merge-duplicates'},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('saveConfig '+r.status);
}

/* =========================================================================
   CALCULS — opèrent sur le barème du RÉFÉRENTIEL central
   ========================================================================= */
function evalSeuil(score, seuils){
  const ordered = seuils.slice().sort((a,b)=>b.min-a.min);
  return ordered.find(s => score >= s.min) || ordered[ordered.length-1];
}
function dimMaxComputed(dim){
  // max théorique d'une dimension = somme des points max de chaque critère
  return dim.crits.reduce((t,c)=>t + Math.max(...c.opts.map(o=>Number(o[1])||0)), 0);
}
/* Points actuels d'un critère pour une saisie donnée. La modalité choisie est
   identifiée par son libellé (saisie['_lab_'+id]) et revalorisée selon le barème
   COURANT : ainsi un changement du barème central se répercute rétroactivement
   sur le score, sans dépendre de la valeur figée au moment du choix. */
function critPoints(crit, saisie){
  const lab = saisie['_lab_'+crit.id];
  if(typeof lab === 'string'){
    const opt = crit.opts.find(o=>o[0]===lab);
    if(opt) return Number(opt[1])||0;
  }
  // repli : ancienne saisie sans libellé mémorisé
  const v = saisie[crit.id];
  return (typeof v==='number') ? v : null;   // null = pas de réponse
}
function critHasAnswer(crit, saisie){
  return (typeof saisie['_lab_'+crit.id]==='string') || (typeof saisie[crit.id]==='number');
}
function computeScore(saisie, bareme){
  let t=0;
  bareme.forEach(d => d.crits.forEach(c => { const p=critPoints(c,saisie); if(typeof p==='number') t+=p; }));
  return t;
}
function maxTotal(bareme){ return bareme.reduce((t,d)=>t+dimMaxComputed(d),0); }

/* ---- Générateur de mot de passe (lettres min/maj + chiffres) ---- */
function genPassword(len){
  len = len || 12;
  const charset='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out=''; const a=new Uint32Array(len);
  (window.crypto||window.msCrypto).getRandomValues(a);
  for(let i=0;i<len;i++) out+=charset[a[i]%charset.length];
  return out;
}

      st.style.color='#7f1d1d'; st.textContent='Suppression des projets…';
      try{

        const ps=await dbListByUser(client.id);
        for(const p of ps){ await dbDelete(p.id); }
        st.textContent='Suppression du compte…';

        await fnCall({action:'delete', user_id:client.id});

      }

function renderProject(){

  current.score=computeScore(current.saisie, current.bareme);

  app().innerHTML =
    '<div class="proj-head"><div>'

function switchTab(name){
  activeTab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('panel-'+name);
  if(panel) panel.classList.add('active');
  // les textarea masqués ont un scrollHeight nul ; on recalcule leur hauteur une fois l'onglet visible
  if(name==='seuils'){
    document.querySelectorAll('#panel-seuils textarea[data-f="reco"]').forEach(autoGrow);
  }
  if(name==='recos'){
    document.querySelectorAll('#panel-recos textarea[data-f="texte"]').forEach(autoGrow);
  }
}

      if(sel.value===''){ delete current.saisie[cid]; delete current.saisie['_lab_'+cid]; }

function refreshSaisieTotals(){
  current.bareme.forEach((d,di)=>{
    let sub=0; d.crits.forEach(c=>{ const p=critPoints(c,current.saisie); if(typeof p==='number') sub+=p; });
    const el=document.querySelector('[data-sub="'+di+'"]'); if(el) el.textContent=sub+' / '+dimMaxComputed(d);
  });
  const total=computeScore(current.saisie,current.bareme); current.score=total;
  const ls=document.getElementById('live-score'); if(ls) ls.textContent=total+' / '+maxTotal(current.bareme);
}

/* ===== Logique de déclenchement des recommandations par dimension =====
   Une dimension déclenche sa recommandation si :
   - au moins une réponse y est saisie (sinon, on ne déclenche pas), ET
   - son sous-total est inférieur ou égal au seuil défini dans current.recos. */
function dimSubtotal(di){
  let sub=0; current.bareme[di].crits.forEach(c=>{ const p=critPoints(c,current.saisie); if(typeof p==='number') sub+=p; });
  return sub;
}
function dimHasAnswer(di){
  return current.bareme[di].crits.some(c=>critHasAnswer(c,current.saisie));
}
function dimTriggers(){
  const out=[];
  current.bareme.forEach((d,di)=>{
    if(!dimHasAnswer(di)) return;                 // dimension non renseignée : ignorée
    const r=(current.recos && current.recos[di]) ? current.recos[di] : {seuil:0,texte:''};
    const sub=dimSubtotal(di);
    if(sub <= (Number(r.seuil)||0)){
      out.push({di, dim:d.dim, sub, max:dimMaxComputed(d), seuil:Number(r.seuil)||0, texte:r.texte||''});
    }
  });
  return out;
}

    +'la recommandation apparaît dans l\'onglet Résultat du projet concerné. Par défaut, le seuil vaut la moitié du maximum de la dimension. '

  CONFIG.bareme.forEach((d,di)=>{
    const r=(CONFIG.recos && CONFIG.recos[di]) ? CONFIG.recos[di] : {seuil:0,texte:''};
    const mx=dimMaxComputed(d);
    h+='<tr><td style="vertical-align:middle;font-weight:600;color:var(--nuit);font-size:13px;">'+esc(d.dim)+'</td>'
      +'<td style="vertical-align:middle;color:var(--gris);font-size:13px;">'+mx+'</td>'

  });
  h+='</table></div>';

  const panel=document.getElementById('panel-recos');
  panel.innerHTML=h;

  panel.querySelectorAll('textarea[data-f="texte"]').forEach(ta=>{
    autoGrow(ta);
    ta.addEventListener('input',()=>autoGrow(ta));

      scheduleConfigSave();
    };

  document.getElementById('reset-recos').onclick=()=>{
    if(!confirm('Réinitialiser les recommandations de référence par défaut ? Ce changement s\'applique à tous les projets.')) return;
    CONFIG.recos=recosDefaultFor(CONFIG.bareme);

  const hero='<div class="res-hero">'
    +'<div class="res-score">'+score+'<span> / '+mx+'</span></div>'
    +'<div class="res-level" style="background:'+s.couleur+'20;color:'+s.couleur+';">'+esc(s.niveau)+'</div>'
    +'<div class="res-segment">Segment visé : <strong>'+esc(s.segment)+'</strong></div></div>'
    +'<div class="res-reco"><div class="rr-lab">Recommandation d\'action</div>'+esc(s.reco)+'</div>';

  // Recommandations par dimension : un bloc par dimension renseignée dont le sous-total ≤ seuil.
  const trigs=dimTriggers();
  let dimReco='';
  if(trigs.length){
    dimReco='<div class="res-dim-recos"><div class="rdr-title">Points de vigilance par dimension</div>';
    trigs.forEach(t=>{
      dimReco+='<div class="dim-reco-block">'
        +'<div class="drb-head"><span class="drb-name">'+esc(t.dim)+'</span>'
        +'<span class="drb-score">'+t.sub+' / '+t.max+' pts</span></div>'
        +'<div class="drb-text">'+esc(t.texte)+'</div></div>';
    });
    dimReco+='</div>';
  }

  document.getElementById('panel-resultat').innerHTML=hero+dimReco;
}

/* ---- Sauvegarde auto ---- */
let saveTimer=null;
function setSync(state,txt){ const el=document.getElementById('sync'); if(!el) return; el.className='badge-sync '+state; el.textContent=txt; }
function scheduleSave(){
  setSync('saving','Enregistrement…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await dbUpdate(current.id, {saisie:current.saisie, score:current.score});
      setSync('saved','Synchronisé');
    }catch(e){ setSync('error','Erreur de synchronisation'); }
  },600);
}

/* Sauvegarde débouncée du référentiel central (espace Saisie Générale, admin). */
let configSaveTimer=null;
function setCfgSync(state,txt){ const el=document.getElementById('cfg-sync'); if(!el) return; el.className='badge-sync '+state; el.textContent=txt; }
function scheduleConfigSave(){
  setCfgSync('saving','Enregistrement…');
  clearTimeout(configSaveTimer);
  configSaveTimer=setTimeout(async()=>{
    try{
      await saveConfig();
      setCfgSync('saved','Référentiel enregistré');
    }catch(e){ setCfgSync('error','Erreur d\'enregistrement'); }
  },600);
}

/* ---- Modale ---- */
function openModal(){ document.getElementById('modal-overlay').classList.add('active'); document.getElementById('np-nom').focus(); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); document.getElementById('np-status').textContent=''; }
document.getElementById('modal-close-btn').onclick=closeModal;
document.getElementById('modal-overlay').onclick=(e)=>{ if(e.target===e.currentTarget) closeModal(); };
document.getElementById('np-create').onclick=async()=>{
  const nom=document.getElementById('np-nom').value.trim();
  const adr=document.getElementById('np-adr').value.trim();
  const st=document.getElementById('np-status');
  if(!nom){ st.style.color='var(--rouge)'; st.textContent='Le nom est requis.'; return; }
  st.style.color='var(--gris)'; st.textContent='Création…';
  try{
    const p=await dbCreate(nom,adr); ensureConfig(p);
    projets.unshift(p);
    document.getElementById('np-nom').value=''; document.getElementById('np-adr').value='';
    closeModal(); openProject(p.id);
  }catch(e){ st.style.color='var(--rouge)'; st.textContent='Erreur lors de la création.'; }
};

/* ---- Modale création d'accès client (admin) ---- */
function openAccessModal(){
  document.getElementById('ac-status').textContent='';
  document.getElementById('ac-result').innerHTML='';
  document.getElementById('ac-ent').value='';
  document.getElementById('ac-mail').value='';
  document.getElementById('ac-create').disabled=false;
  document.getElementById('ac-create').style.display='';
  document.getElementById('access-overlay').classList.add('active');
  document.getElementById('ac-ent').focus();
}
function closeAccessModal(){ document.getElementById('access-overlay').classList.remove('active'); }
document.getElementById('access-close-btn').onclick=()=>{ closeAccessModal(); renderAdmin(); };
document.getElementById('access-overlay').onclick=(e)=>{ if(e.target===e.currentTarget){ closeAccessModal(); renderAdmin(); } };
document.getElementById('ac-create').onclick=async()=>{
  const ent=document.getElementById('ac-ent').value.trim();
  const mail=document.getElementById('ac-mail').value.trim();
  const st=document.getElementById('ac-status');
  if(!mail){ st.style.color='var(--rouge)'; st.textContent='L\'adresse e-mail est requise.'; return; }
  const pwd=genPassword(12);
  st.style.color='var(--gris)'; st.textContent='Création de l\'accès…';
  const btn=document.getElementById('ac-create'); btn.disabled=true;
  try{
    await fnCall({action:'create', email:mail, password:pwd, entreprise:ent});
    st.textContent='';
    btn.style.display='none';
    document.getElementById('ac-result').innerHTML=
      '<div class="pwd-reveal"><div class="pl">Accès créé — mot de passe</div>'
      +'<div class="pv">'+esc(pwd)+'</div>'
      +'<div class="ph">Identifiant : '+esc(mail)+'<br>Transmettez ces informations au client par un canal sûr. Le mot de passe ne sera plus affiché ensuite.</div></div>';
  }catch(e){
    st.style.color='var(--rouge)';
    st.textContent='Échec : '+String(e.message||e);
    btn.disabled=false;
  }
};

/* ---- Routage : connexion → admin ou espace client ---- */
function routeRoot(){
  current=null;
  if(!session){ renderLogin(); return; }
  (async()=>{
    app().innerHTML='<div class="state-msg">Chargement…</div>';
    // Le référentiel central est chargé une fois la session établie : barème, seuils
    // et recommandations en proviennent, pour l'admin comme pour les clients.
    await loadConfig();
    if(isAdmin){ adminView=null; viewingClient=null; adminTab='projets'; renderAdminProjects(); return; }
    try{ projets=await dbList(); projets.forEach(ensureConfig); viewingClient=null; renderHome(); }
    catch(e){ app().innerHTML='<div class="state-msg">Connexion impossible.<br>Réessayez ou reconnectez-vous.</div>'; }
  })();
}

document.getElementById('logo-home').onclick=()=>{
  current=null; viewingClient=null; adminView=null;
  routeRoot();
};

/* ---- Boot ---- */
loadSession();
routeRoot();
</script>
